name: Phase 1 Validation and Data Gate

on:
  push:
    branches: [ main, material-upload ]
  pull_request:
    branches: [ main, material-upload ]

jobs:
  validate-phase1:
    name: Validate Data Integrity and Deliverables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python scripts syntax
        run: |
          python -c "
          import py_compile, glob, sys
          scripts = glob.glob('scripts/*.py')
          for script in scripts:
              try:
                  py_compile.compile(script, doraise=True)
                  print(f'Syntax valid: {script}')
              except Exception as e:
                  print(f'Syntax error in {script}: {e}')
                  sys.exit(1)
          "

      - name: Validate JSON payload integrity
        run: |
          python -c "
          import json, glob, sys
          files = glob.glob('data/*.json')
          if not files:
              print('Error: No JSON data files found in data/')
              sys.exit(1)

          failed = False
          for f in files:
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      data = json.load(fp)
                  print(f'Valid JSON: {f}')
              except Exception as e:
                  print(f'Invalid JSON in {f}: {e}')
                  failed = True
          if failed:
              sys.exit(1)
          "

      - name: Verify Cryptographic Hash Integrity against Manifest
        run: |
          python -c "
          import json, hashlib, sys
          from pathlib import Path

          manifest_path = Path('data/source_manifest.json')
          if not manifest_path.exists():
              print('Missing data/source_manifest.json')
              sys.exit(1)

          with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = json.load(f)

          failed = False
          for name, meta in manifest.get('artifacts', {}).items():
              filename = meta.get('file')
              expected_sha = meta.get('sha256')
              target_file = Path('data') / filename

              if not target_file.exists():
                  print(f'Missing manifested file: {target_file}')
                  failed = True
                  continue

              hasher = hashlib.sha256()
              with open(target_file, 'rb') as fp:
                  while chunk := fp.read(65536):
                      hasher.update(chunk)
              computed_sha = hasher.hexdigest()

              if computed_sha == expected_sha:
                  print(f'SHA-256 match for {filename}: {computed_sha[:12]}...')
              else:
                  print(f'SHA-256 mismatch for {filename}: expected {expected_sha}, got {computed_sha}')
                  failed = True

          if failed:
              sys.exit(1)
          "

      - name: Verify Deliverables Structure and Documentation
        run: |
          python -c "
          import glob, os, sys
          from pathlib import Path

          # 1. Core repository configuration files
          required_roots = ['README.md', 'LICENSE', '.gitignore', '.gitattributes']
          missing_roots = [f for f in required_roots if not os.path.exists(f)]
          if missing_roots:
              print(f'Error: Missing root files: {missing_roots}')
              sys.exit(1)

          # 2. Check for Proposal PDF (flexible matching instead of brittle exact filename)
          proposal_pdfs = glob.glob('docs/*[Pp]roposal*.pdf') + glob.glob('docs/*.pdf')
          if not proposal_pdfs:
              print('Error: No proposal PDF found in docs/')
              sys.exit(1)
          print(f'Proposal document verified: {proposal_pdfs[0]}')

          # 3. Check for technical specifications
          specs = ['docs/ARCHITECTURE.md', 'docs/FINOPS.md']
          for spec in specs:
              if os.path.exists(spec):
                  print(f'Technical spec verified: {spec}')
              else:
                  print(f'Warning: Optional spec not present: {spec}')

          # 4. Check data directory contents
          data_files = glob.glob('data/*.json')
          if len(data_files) < 3:
              print(f'Error: Expected at least 3 sample data payloads, found {len(data_files)}')
              sys.exit(1)

          print('All repository structure and deliverables checks passed.')
          "
