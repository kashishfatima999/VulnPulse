name: Phase 1 Validation and Data Gate

on:
  push:
    branches: [ main, material-upload ]
  pull_request:
    branches: [ main, material-upload ]

jobs:
  validate-phase1:
    name: Validate Samples and Deliverables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python script syntax
        run: |
          python -m py_compile scripts/collect_phase1_samples.py

      - name: Validate Sample JSON payloads
        run: |
          python -c "
          import json, glob, sys
          files = glob.glob('data/*.json')
          if not files:
              print('Error: No JSON files found in data/')
              sys.exit(1)
          failed = False
          for f in files:
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      json.load(fp)
                  print(f'Valid JSON: {f}')
              except Exception as e:
                  print(f'Invalid JSON in {f}: {e}')
                  failed = True
          if failed:
              sys.exit(1)
          "

      - name: Verify SHA-256 Integrity against Manifest
        run: |
          python -c "
          import json, hashlib, sys
          from pathlib import Path

          manifest_path = Path('data/source_manifest.json')
          if not manifest_path.exists():
              print('Missing data/source_manifest.json')
              sys.exit(1)

          with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = json.load(f)

          failed = False
          for name, meta in manifest.get('artifacts', {}).items():
              filename = meta['file']
              expected_sha = meta['sha256']
              target_file = Path('data') / filename
              if not target_file.exists():
                  print(f'Missing sample file: {target_file}')
                  failed = True
                  continue
              hasher = hashlib.sha256()
              with open(target_file, 'rb') as fp:
                  while chunk := fp.read(65536):
                      hasher.update(chunk)
              computed_sha = hasher.hexdigest()
              if computed_sha == expected_sha:
                  print(f'SHA-256 match for {filename}: {computed_sha[:12]}...')
              else:
                  print(f'SHA-256 mismatch for {filename}: expected {expected_sha}, got {computed_sha}')
                  failed = True
          if failed:
              sys.exit(1)
          "

      - name: Verify Required Phase 1 Deliverables
        run: |
          python -c "
          import os, sys
          required_files = [
              'README.md',
              'LICENSE',
              '.gitignore',
              '.gitattributes',
              'docs/Phase1_Proposal.pdf',
              'docs/ARCHITECTURE.md',
              'docs/FINOPS.md',
              'data/nvd_full_load_sample.json',
              'data/nvd_incremental_load_sample.json',
              'data/cisa_kev_sample.json',
              'data/source_manifest.json',
              'data/README.md',
              'scripts/collect_phase1_samples.py'
          ]
          missing = [f for f in required_files if not os.path.exists(f)]
          if missing:
              print('Missing required deliverables:', missing)
              sys.exit(1)
          print(f'All {len(required_files)} core deliverables confirmed.')
          "
