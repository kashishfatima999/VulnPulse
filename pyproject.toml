[project]
name = "vulnpulse"
version = "0.2.0"
description = "Cyber vulnerability intelligence lakehouse on Databricks (NVD + CISA KEV)."
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Default pyflakes/pycodestyle errors plus bugbear (common runtime mistakes).
# Add "I" (import sorting) and "UP" (modern syntax) later once the codebase is formatted.
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "spark: tests that start a local SparkSession (slower; skip with -m 'not spark')",
]
